name: CI

on:
  push:
    branches: [main, 'codex/windows-*']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: svelte-check
        run: npm run check

      - name: UI tests
        run: npm test

      # generate_context! reads ../dist at compile time
      - name: UI build
        run: npm run build

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Native Windows status line shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = 'C:/Program Files/Git/bin/bash.exe'
          if (!(Test-Path -LiteralPath $bash)) { throw 'Git Bash unavailable on runner' }
          "KVOJPS_MONITOR_TEST_GIT_BASH=$bash" >> $env:GITHUB_ENV

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Real Windows vault (synthetic credential, removed after test)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked native_vault_roundtrip_is_local_machine_and_cleanup_is_idempotent -- --ignored

      - name: Native npm Codex stdio (isolated home, no login)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'monitor-ai-codex'
          npm install --prefix $cli --ignore-scripts --no-audit --no-fund '@openai/codex@0.154.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $cli 'node_modules/.bin') + ';' + $env:PATH
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'monitor-ai-isolated-home'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          cargo test --locked windows_npm_codex_initializes_over_stdio_without_login -- --ignored
          exit $LASTEXITCODE

      - name: fixture mode clippy (development only)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked --features fixtures -- -D warnings

      - name: fixture mode tests (development only)
        working-directory: src-tauri
        run: cargo test --locked --features fixtures --lib fixtures

      - name: Tauri build without bundling
        if: runner.os == 'Linux'
        run: npm run tauri -- build --no-bundle

      - name: Build unsigned per-user Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis

      - name: Release GUI executable supports silent hooks and status line
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: |
          $env:KVOJPS_MONITOR_TEST_BINARY = (Resolve-Path 'target/release/kvojps-monitor.exe').Path
          cargo test --locked --test windows_hook_mode windows_hook_command_preserves_stdin_and_special_paths_without_content_leaks -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test windows_statusline_mode

      - name: Windows foundation executable (experimental, unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-foundation-experimental-unsigned
          path: src-tauri/target/release/kvojps-monitor.exe
          retention-days: 7
          if-no-files-found: error

      - name: Windows x64 installer (unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

      - name: Install and uninstall as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-windows-installer.ps1
