name: CI

on:
  push:
    branches: [main, 'codex/windows-*']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: svelte-check
        run: npm run check

      - name: UI tests
        run: npm test

      # generate_context! reads ../dist at compile time
      - name: UI build
        run: npm run build

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Real Windows vault (synthetic credential, removed after test)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked native_vault_roundtrip_is_local_machine_and_cleanup_is_idempotent -- --ignored

      - name: fixture mode (development only)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --locked --features fixtures -- -D warnings
          cargo test --locked --features fixtures --lib fixtures

      - name: Tauri build without bundling
        run: npm run tauri -- build --no-bundle

      - name: Windows foundation executable (experimental, unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-foundation-experimental-unsigned
          path: src-tauri/target/release/kvojps-monitor.exe
          retention-days: 7
          if-no-files-found: error
