[package]
name = "kvojps-monitor"
version = "0.1.1"
description = "Indicador de bandeja que reúne IA, Agentes, GitHub, Trello, rede e sistema"
authors = ["Kvojps"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kvojps_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Development only: the native panel shows prototype B's fixtures (see fixtures.rs)
# and agents can capture it (see capture.rs). The optional crates are already
# in the tree through wry; the feature only names them.
fixtures = ["dep:webkit2gtk", "dep:javascriptcore-rs", "dep:cairo-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = "0.6"
dirs = "6"

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rusqlite = "0.38"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Keep Ubuntu on its existing system SQLite; Windows ships a self-contained build.
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
windows-registry = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Notifications", "Win32_Networking_NetworkListManager"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
ksni = "0.3"
rustix = { version = "1", features = ["fs"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# Panel window margin (src/panel.rs); already in the tree through tauri.
gtk = "0.18"
# Fixture mode only: snapshot of the panel webview.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"], optional = true }
javascriptcore-rs = { version = "=1.1.2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
